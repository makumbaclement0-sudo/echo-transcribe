[project]
name = "pmbot"
version = "0.1.0"
description = "Polymarket market-making and complete-set arbitrage bot (paper-first)"
requires-python = ">=3.11"
dependencies = []  # core runs on the standard library only

[project.optional-dependencies]
live = ["polymarket-client"]  # official Polymarket SDK, only needed for --live
dev = ["pytest>=8"]

[project.scripts]
pmbot = "pmbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pmbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
